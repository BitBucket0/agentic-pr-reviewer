[project]
name = "agentic-pr-reviewer"
version = "0.3.0"
description = "Stateful LangGraph workflow that reviews Git diffs with a reviewer-verifier loop and deterministic checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dhananjay Raghu" }]
keywords = [
    "langgraph",
    "llm",
    "code-review",
    "github-actions",
    "ai-agents",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "langgraph>=1.2.9,<1.3",
    "langchain-openai>=1.4.1,<1.5",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
checks = ["ruff>=0.6", "pytest>=8"]
anthropic = ["langchain-anthropic>=1.5,<2"]
google = ["langchain-google-genai>=4.3,<5"]
groq = ["langchain-groq>=1.1,<2"]
mistral = ["langchain-mistralai>=1.1,<2"]
all = [
    "langchain-anthropic>=1.5,<2",
    "langchain-google-genai>=4.3,<5",
    "langchain-groq>=1.1,<2",
    "langchain-mistralai>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "build", "twine"]

[project.scripts]
agentic-pr-reviewer = "reviewer.cli:main"

[project.urls]
Homepage = "https://github.com/BitBucket0/agentic-pr-reviewer"
Repository = "https://github.com/BitBucket0/agentic-pr-reviewer"
Issues = "https://github.com/BitBucket0/agentic-pr-reviewer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewer"]

[tool.hatch.build.targets.sdist]
include = ["reviewer", "examples", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py311"

name: Commit Review

# Reviews commits pushed directly to the default branch. PR-branch pushes are
# already covered by pr-review.yml (pull_request_target synchronize), so this is
# restricted to main to avoid duplicate reviews and doubled API cost.
on:
  push:
    branches: [main]

# Output is a job summary + artifact only (no commit comments), so read is enough.
permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install .

      - name: Review pushed changes
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not configured; skipping review." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            BASE="${AFTER}~1"
          else
            BASE="$BEFORE"
          fi
          git diff "$BASE" "$AFTER" > commit.diff 2>/dev/null || git diff "${AFTER}~1" "$AFTER" > commit.diff
          set +e
          agentic-pr-reviewer --diff commit.diff --output review.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "# Commit Review"
            echo
            cat review.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commit-review-${{ github.sha }}
          path: review.md
          if-no-files-found: ignore

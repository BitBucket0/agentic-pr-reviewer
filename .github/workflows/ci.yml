name: CI

on:
  pull_request:
  push:
    branches: [main]

# No secrets are used in this workflow, so it is safe to run untrusted PR code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[checks]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

name: PR Review

# SECURITY MODEL:
# This workflow uses `pull_request_target`, so it runs with the base repo's
# token and secrets. It therefore must NEVER check out or execute the PR's
# head code. It only:
#   1. checks out the trusted BASE branch (default ref for pull_request_target)
#      and installs the reviewer from there, and
#   2. reads the PR diff as DATA via the GitHub API.
# The PR's source tree is never placed on disk or executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Default ref under pull_request_target is the BASE branch (trusted).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Install the trusted reviewer from the base checkout. Once the package
      # is published you can replace this with:
      #   pip install "agentic-pr-reviewer==0.1.0"
      # and drop the checkout step above.
      - name: Install reviewer
        run: pip install .

      - name: Fetch PR diff as data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -H "Accept: application/vnd.github.diff" \
            "/repos/${GH_REPO}/pulls/${PR_NUMBER}" > pr.diff

      - name: Review diff
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            printf '# PR Review\n\nSkipped: OPENAI_API_KEY secret is not configured.\n' > review.md
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          agentic-pr-reviewer --diff pr.diff --output review.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Post sticky PR comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agentic-pr-reviewer -->';
            const body = marker + '\n' + fs.readFileSync('review.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Advisory: keep this check out of branch protection so a non-zero
      # (incomplete review / model failure) does not block merges, while still
      # surfacing infrastructure failures instead of hiding them behind "|| true".
      - name: Reflect review status
        if: steps.review.outputs.status != '0' && steps.review.outputs.status != 'skipped'
        run: |
          echo "Review exited with status ${{ steps.review.outputs.status }}"
          exit 1
